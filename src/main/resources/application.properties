spring.application.name=electromart

# Port is read from the PORT environment variable (default 8080).
server.port=${PORT:8080}

# Location of the single JSON state file holding inventory, orders and idempotency records.
# Read from the ELECTROMART_DATA_FILE environment variable (default data/electromart-state.json).
electromart.data-file=${ELECTROMART_DATA_FILE:data/electromart-state.json}

# Admin user and password settings
electromart.admin-user=${ELECTROMART_ADMIN_USER:bmesa@gmail.com}
electromart.admin-password=${ELECTROMART_ADMIN_PASSWORD:}

# The existing frontend is packaged under /static and served from the same origin as the API.
spring.web.resources.static-locations=classpath:/static/
spring.mvc.problemdetails.enabled=false

# A quantity such as 1.5 must be rejected, never silently truncated to an integer.
spring.jackson.deserialization.accept-float-as-int=false
